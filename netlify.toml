# Netlify builds and hosts the public site (front/) as static files.
# The admin and the content server need Node with a writable disk, so they are
# not deployed here; they run on your own machine or server (see README.md).
# These settings override the build settings in the Netlify dashboard.

[build]
  # Install dependencies and run the build inside front/ (the repo root has no dependencies).
  base = "front"
  command = "npm run build"
  # Relative to base, so this is front/dist.
  publish = "dist"

[build.environment]
  # Same Node version as the GitHub Pages workflow.
  NODE_VERSION = "22"

# Single-page app: unknown paths load the app, which shows its own 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
