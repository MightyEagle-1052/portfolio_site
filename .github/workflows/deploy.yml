name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build the public site (front/) and the admin (admin/, served at /admin/) as static files.
  # GitHub Pages can't run the server, so this admin saves by committing to the repository
  # with the user's GitHub token, which runs this workflow again.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            front/package-lock.json
            admin/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm run setup:static

      - name: Build website and admin
        env:
          # Pages serves the site under /<repo-name>/ (or / with a custom domain).
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build:static

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./front/dist

  # Separate job so a failed deploy can be re-run on its own ("Re-run failed jobs")
  # without uploading a second copy of the site.
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
